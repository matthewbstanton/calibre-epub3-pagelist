name: Build Plugin

on:
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Only after tests pass on a push to master (or a manual run)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build plugin ZIP
      run: python3 build.py

    - name: Get short SHA and version
      id: info
      run: |
        echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        echo "version=$(python3 -c "import re;print('.'.join(re.search(r'version\s*=\s*\((\d+),\s*(\d+),\s*(\d+)\)', open('__init__.py').read()).groups()))")" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: epub3_pagelist-${{ steps.info.outputs.sha }}
        path: epub3_pagelist.zip

    - name: Create release if version is new
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.info.outputs.version }}
      run: |
        if gh release view "$VERSION" >/dev/null 2>&1; then
          echo "Release $VERSION already exists, skipping."
        else
          gh release create "$VERSION" epub3_pagelist.zip \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" --generate-notes
        fi
